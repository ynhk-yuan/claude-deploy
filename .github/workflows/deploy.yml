name: Deploy to My Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/claude_deploy
            git pull origin main
            docker build -t claude-app .
            docker stop claude-container || true
            docker rm claude-container || true
            docker run -d --restart always -p 8000:8000 --name claude-container claude-app